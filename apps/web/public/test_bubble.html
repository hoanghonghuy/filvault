<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body {
  background: #18181b;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  padding: 40px 20px;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 12px;
}

.message-row {
  display: flex;
  justify-content: flex-end;
  width: 100%;
}

.message-bubble {
  position: relative;
  max-width: min(74%, 480px);
  padding: 8px 14px;
  border-radius: 18px;
  background: #B2E6FC;
  color: #123746;
  font-size: 15px;
  line-height: 1.36;
  word-break: break-word;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
}

.bubble-decoration {
  position: absolute;
  pointer-events: none;
  z-index: 3;
  display: flex;
  align-items: center;
  justify-content: center;
}

.bubble-decoration-img {
  display: block;
  max-height: 28px;
  width: auto;
  object-fit: contain;
  pointer-events: none;
  user-select: none;
  filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
}

.dec-top-left {
  top: -14px;
  left: 6px;
}

.dec-top-right {
  top: -14px;
  right: 6px;
}

.dec-bottom-right {
  bottom: -10px;
  right: 6px;
}

.message-bubble p {
  margin: 0;
  white-space: pre-wrap;
}

.bubble-time {
  display: block;
  margin-top: 2px;
  text-align: right;
  opacity: 0.65;
  font-size: 11px;
}
</style>
</head>
<body>

<div class="message-row">
  <div class="message-bubble">
    <div class="bubble-decoration dec-top-left">
      <img src="/bubbles/decorations/frog_head.png" class="bubble-decoration-img" />
    </div>
    <div class="bubble-decoration dec-top-right">
      <img src="/bubbles/decorations/chick_head.png" class="bubble-decoration-img" />
    </div>
    <div class="bubble-decoration dec-bottom-right">
      <img src="/bubbles/decorations/water_bubbles.png" class="bubble-decoration-img" />
    </div>
    <p>Nay bạn có thể thay đổi kiểu bong bóng và cuộc trò chuyện sẽ có giao diện mới. Quá ngầu!</p>
    <span class="bubble-time">14:40</span>
  </div>
</div>

<div class="message-row">
  <div class="message-bubble">
    <div class="bubble-decoration dec-top-left">
      <img src="/bubbles/decorations/frog_head.png" class="bubble-decoration-img" />
    </div>
    <div class="bubble-decoration dec-top-right">
      <img src="/bubbles/decorations/chick_head.png" class="bubble-decoration-img" />
    </div>
    <div class="bubble-decoration dec-bottom-right">
      <img src="/bubbles/decorations/water_bubbles.png" class="bubble-decoration-img" />
    </div>
    <p>Alo bạn ơi</p>
    <span class="bubble-time">14:41</span>
  </div>
</div>

<div class="message-row">
  <div class="message-bubble">
    <div class="bubble-decoration dec-top-left">
      <img src="/bubbles/decorations/frog_head.png" class="bubble-decoration-img" />
    </div>
    <div class="bubble-decoration dec-top-right">
      <img src="/bubbles/decorations/chick_head.png" class="bubble-decoration-img" />
    </div>
    <div class="bubble-decoration dec-bottom-right">
      <img src="/bubbles/decorations/water_bubbles.png" class="bubble-decoration-img" />
    </div>
    <p>Ok</p>
    <span class="bubble-time">14:42</span>
  </div>
</div>

</body>
</html>
