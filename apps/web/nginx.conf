server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 0;

    # Vite emits content-hashed filenames; they are safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The HTML entry references the hashed assets and must always revalidate,
    # otherwise a cached copy keeps loading a stale (removed) JS bundle.
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Reverse proxy API requests to backend container
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (Server-Sent Events) and streaming support
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
    }

    # Reverse proxy MinIO S3 object store requests (uploads & downloads via same origin)
    location /filvault/ {
        proxy_pass http://minio:9000;
        proxy_http_version 1.1;

        set $s3_host $http_x_presigned_host;
        if ($s3_host = "") {
            set $s3_host "192.168.1.6:9002";
        }
        proxy_set_header Host $s3_host;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 0;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
