name: filvault_mobile
description: "Filvault Personal Cloud Storage & Secure Direct Messaging Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & Dependency Injection
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing & Deep Linking
  go_router: ^14.2.0

  # Networking & REST API
  dio: ^5.4.3+1
  dio_smart_retry: ^6.0.0

  # Realtime WebRTC Calling
  livekit_client: ^2.1.5
  flutter_webrtc: ^0.10.8

  # Incoming Call & System Calling Screen
  flutter_callkeep: ^0.3.3

  # Push Notifications & Background Wakeup
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.1
  flutter_local_notifications: ^17.2.1

  # Local Offline Database & Caching
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.21
  path_provider: ^2.1.3
  path: ^1.9.0

  # Secure Hardware Storage (Keystore / Keychain)
  flutter_secure_storage: ^9.2.2

  # Media Caching & Image Viewer
  cached_network_image: ^3.3.1
  photo_view: ^0.14.0
  video_player: ^2.8.6
  chewie: ^1.8.1

  # Native Hardware & Permissions
  local_auth: ^2.2.0
  image_picker: ^1.1.2
  file_picker: ^8.0.5
  permission_handler: ^11.3.1
  share_plus: ^9.0.0
  receive_sharing_intent: ^1.4.5
  proximity_sensor: ^1.3.3

  # UI Utilities & Icons
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  drift_dev: ^2.18.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
