services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: filnest
      POSTGRES_PASSWORD: filnest
      POSTGRES_DB: filnest
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filnest -d filnest"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - filnest_pg:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: filnest
      MINIO_ROOT_PASSWORD: filnestsecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - filnest_minio:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 5
        mc alias set local http://minio:9000 filnest filnestsecret
        mc mb --ignore-existing local/filnest
        mc anonymous set none local/filnest
    volumes:
      - filnest_minio:/data

volumes:
  filnest_pg:
  filnest_minio:
