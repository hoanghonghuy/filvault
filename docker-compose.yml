name: filvault

services:
  postgres:
    container_name: filvault-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: filvault
      POSTGRES_PASSWORD: ${FILVAULT_POSTGRES_PASSWORD}
      POSTGRES_DB: filvault
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filvault -d filvault"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - filvault_postgres_data:/var/lib/postgresql/data

  minio:
    container_name: filvault-minio
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${FILVAULT_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${FILVAULT_S3_SECRET_KEY}
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - filvault_minio_data:/data

  minio-init:
    container_name: filvault-minio-init
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      FILVAULT_S3_ACCESS_KEY: ${FILVAULT_S3_ACCESS_KEY}
      FILVAULT_S3_SECRET_KEY: ${FILVAULT_S3_SECRET_KEY}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 5
        mc alias set local http://minio:9000 "$$FILVAULT_S3_ACCESS_KEY" "$$FILVAULT_S3_SECRET_KEY"
        mc mb --ignore-existing local/filvault
        mc anonymous set none local/filvault

  api:
    container_name: filvault-api
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      FILVAULT_METADATA_STORE: postgres
      FILVAULT_OBJECT_STORE: s3
      FILVAULT_DATABASE_URL: postgres://filvault:${FILVAULT_POSTGRES_PASSWORD}@postgres:5432/filvault?sslmode=disable
      FILVAULT_S3_ENDPOINT: http://minio:9000
      FILVAULT_S3_PUBLIC_ENDPOINT: http://${FILVAULT_HOST:-localhost}:9002
      FILVAULT_S3_BUCKET: filvault
      FILVAULT_S3_REGION: us-east-1
      FILVAULT_S3_ACCESS_KEY: ${FILVAULT_S3_ACCESS_KEY}
      FILVAULT_S3_SECRET_KEY: ${FILVAULT_S3_SECRET_KEY}
      FILVAULT_INVITE_CODE: ${FILVAULT_INVITE_CODE}
      FILVAULT_SEED_DEV_USER: "true"
      FILVAULT_SEED_EMAIL: ${FILVAULT_SEED_EMAIL}
      FILVAULT_SEED_PASSWORD: ${FILVAULT_SEED_PASSWORD}
      FILVAULT_SEED_DISPLAY_NAME: ${FILVAULT_SEED_DISPLAY_NAME}
      FILVAULT_JWT_SECRET: ${FILVAULT_JWT_SECRET}
      FILVAULT_HTTP_ADDR: ":8080"
      FILVAULT_MAILER: console
      FILVAULT_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://${FILVAULT_HOST:-localhost}:5173
      FILVAULT_DEFAULT_TRASH_AUTO_DELETE: "false"
      FILVAULT_DEFAULT_TRASH_RETENTION_DAYS: "30"
      FILVAULT_LIVEKIT_URL: http://livekit:7880
      FILVAULT_LIVEKIT_PUBLIC_URL: ws://${FILVAULT_HOST:-localhost}:7880
      FILVAULT_LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      FILVAULT_LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      livekit:
        condition: service_started

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  livekit:
    container_name: filvault-livekit
    image: livekit/livekit-server:v1.8
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./deploy/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50020:50000-50020/udp"
    restart: unless-stopped

  migrate:
    container_name: filvault-migrate
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    entrypoint: ["migrate"]
    environment:
      FILVAULT_DATABASE_URL: postgres://filvault:${FILVAULT_POSTGRES_PASSWORD}@postgres:5432/filvault?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  worker:
    container_name: filvault-worker
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    entrypoint: ["worker"]
    environment:
      FILVAULT_METADATA_STORE: postgres
      FILVAULT_OBJECT_STORE: s3
      FILVAULT_DATABASE_URL: postgres://filvault:${FILVAULT_POSTGRES_PASSWORD}@postgres:5432/filvault?sslmode=disable
      FILVAULT_S3_ENDPOINT: http://minio:9000
      FILVAULT_S3_BUCKET: filvault
      FILVAULT_S3_REGION: us-east-1
      FILVAULT_S3_ACCESS_KEY: ${FILVAULT_S3_ACCESS_KEY}
      FILVAULT_S3_SECRET_KEY: ${FILVAULT_S3_SECRET_KEY}
      FILVAULT_JWT_SECRET: ${FILVAULT_JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    container_name: filvault-web
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "5173:80"
    depends_on:
      - api
      - minio
    restart: unless-stopped

volumes:
  filvault_postgres_data:
  filvault_minio_data:
