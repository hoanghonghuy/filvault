services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: filvault
      POSTGRES_PASSWORD: filvault
      POSTGRES_DB: filvault
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filvault -d filvault"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - filvault_postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: filvault
      MINIO_ROOT_PASSWORD: filvaultsecret
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - filvault_minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 5
        mc alias set local http://minio:9000 filvault filvaultsecret
        mc mb --ignore-existing local/filvault
        mc anonymous set none local/filvault

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      FILVAULT_METADATA_STORE: postgres
      FILVAULT_OBJECT_STORE: s3
      FILVAULT_DATABASE_URL: postgres://filvault:filvault@postgres:5432/filvault?sslmode=disable
      FILVAULT_S3_ENDPOINT: http://minio:9000
      FILVAULT_S3_PUBLIC_ENDPOINT: http://localhost:9000
      FILVAULT_S3_BUCKET: filvault
      FILVAULT_S3_REGION: us-east-1
      FILVAULT_S3_ACCESS_KEY: filvault
      FILVAULT_S3_SECRET_KEY: filvaultsecret
      FILVAULT_INVITE_CODE: dev-invite
      FILVAULT_SEED_DEV_USER: "true"
      FILVAULT_SEED_EMAIL: dev@filvault.com
      FILVAULT_SEED_PASSWORD: Dev1234@
      FILVAULT_SEED_DISPLAY_NAME: Filvault Dev
      FILVAULT_JWT_SECRET: dev-jwt-secret
      FILVAULT_HTTP_ADDR: ":8080"
      FILVAULT_MAILER: console
      FILVAULT_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      FILVAULT_DEFAULT_TRASH_AUTO_DELETE: "false"
      FILVAULT_DEFAULT_TRASH_RETENTION_DAYS: "30"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080/api/v1
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  filvault_postgres_data:
  filvault_minio_data:
