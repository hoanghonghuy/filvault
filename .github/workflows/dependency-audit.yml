name: Dependency Audit

on:
  pull_request:
    paths:
      - 'apps/web/package.json'
      - 'apps/web/package-lock.json'
      - '.github/workflows/dependency-audit.yml'
  workflow_dispatch:

jobs:
  web-npm-audit:
    name: Web — dependency vulnerability policy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Gate high/critical production vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Capture full audit evidence
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit.json
          status=$?
          set -e
          node <<'NODE'
          const fs = require('fs')
          const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'))
          const vulnerabilities = report.vulnerabilities ?? {}
          const rows = Object.entries(vulnerabilities)
            .map(([name, item]) => ({
              name,
              severity: item.severity,
              direct: item.isDirect,
              via: (item.via ?? []).map((entry) => typeof entry === 'string' ? entry : `${entry.source}:${entry.title}`),
              effects: item.effects ?? [],
              range: item.range,
              fixAvailable: item.fixAvailable,
            }))
            .sort((a, b) => a.name.localeCompare(b.name))
          console.log(JSON.stringify({ metadata: report.metadata, vulnerabilities: rows }, null, 2))
          NODE
          echo "full npm audit exit status: ${status} (dev/test findings are evidence, not a production gate)"

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-npm-audit-${{ github.run_id }}
          path: apps/web/npm-audit.json
          retention-days: 7
