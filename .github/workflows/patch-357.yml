name: Patch issue 357

on:
  push:
    branches:
      - fix/357-vault-auth-hydration-separation

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[patch-357-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/357-vault-auth-hydration-separation
          fetch-depth: 0
      - name: Patch VaultView hydration flow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/views/VaultView.vue')
          text = path.read_text()
          replacements = [
              (
                  "    await vault.setup(setupPin.value.trim())\n    ui.showToast(t.value.vaultUnlockedNotice, 'success')",
                  "    await vault.setup(setupPin.value.trim())\n    await loadVaultFiles()\n    ui.showToast(t.value.vaultUnlockedNotice, 'success')",
              ),
              (
                  "    await vault.unlock(unlockPin.value.trim())\n    ui.showToast(t.value.vaultUnlockedNotice, 'success')",
                  "    await vault.unlock(unlockPin.value.trim())\n    await loadVaultFiles()\n    ui.showToast(t.value.vaultUnlockedNotice, 'success')",
              ),
              (
                  "    await vault.resetPin(accountPassword.value, resetNewPin.value.trim())\n    ui.showToast(t.value.vaultUnlockedNotice, 'success')",
                  "    await vault.resetPin(accountPassword.value, resetNewPin.value.trim())\n    await loadVaultFiles()\n    ui.showToast(t.value.vaultUnlockedNotice, 'success')",
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one match, found {count}: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          Path('.github/workflows/patch-357.yml').unlink()
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/views/VaultView.vue .github/workflows/patch-357.yml
          git diff --cached --check
          git commit -m "fix(web): route vault hydration through recovery state (#357) [patch-357-done]"
          git push origin HEAD:fix/357-vault-auth-hydration-separation
