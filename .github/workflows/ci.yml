name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Security — secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch develop for commit-range base
        run: git fetch origin develop:refs/remotes/origin/develop

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.25.0/gitleaks_8.25.0_linux_x64.tar.gz \
            | tar xz -C /usr/local/bin gitleaks

      - name: Verify secret scan gate
        env:
          GITLEAKS_BASE_REF: origin/develop
        run: ./scripts/verify-secret-scan-gate.sh

  api:
    name: API — lint, typecheck, test
    runs-on: ubuntu-latest
    env:
      # Local-only placeholders — must match .env.example / Makefile defaults and compose substitution.
      FILVAULT_POSTGRES_PASSWORD: replace-with-local-postgres-password
      FILVAULT_S3_ACCESS_KEY: filvault
      FILVAULT_S3_SECRET_KEY: replace-with-local-s3-secret-key
      DSN: postgres://filvault:replace-with-local-postgres-password@127.0.0.1:5435/filvault?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Start Postgres and MinIO
        run: docker compose up -d postgres minio minio-init

      - name: Wait for Postgres
        run: |
          streak=0
          for i in $(seq 1 30); do
            if docker compose exec -T postgres psql -U filvault -d filvault -c 'SELECT 1' >/dev/null 2>&1; then
              streak=$((streak + 1))
              if [ "$streak" -ge 2 ]; then
                echo "postgres ready after ${i}s (2 consecutive SQL probes succeeded)"
                exit 0
              fi
            else
              streak=0
            fi
            sleep 1
          done
          echo "postgres did not become ready within 30s"
          echo "--- docker compose ps ---"
          docker compose ps -a
          echo "--- postgres logs (last 80 lines) ---"
          docker compose logs --tail=80 postgres
          echo "--- minio logs (last 40 lines) ---"
          docker compose logs --tail=40 minio
          echo "--- minio-init logs (last 40 lines) ---"
          docker compose logs --tail=40 minio-init
          exit 1

      - name: Migrate (pre-deploy)
        working-directory: apps/api
        run: go run ./cmd/migrate
        env:
          FILVAULT_DATABASE_URL: ${{ env.DSN }}

      - name: Lint
        working-directory: apps/api
        run: go vet ./...

      - name: Typecheck
        working-directory: apps/api
        run: go build -o /dev/null ./...

      - name: Test
        working-directory: apps/api
        run: go test ./... -count=1 -p 1
        env:
          FILVAULT_DATABASE_URL: ${{ env.DSN }}

  web:
    name: Web — lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run type-check

      - name: Test
        run: npm run test -- --run

      - name: Build
        run: npm run build-only

  e2e:
    name: Web — E2E critical path
    runs-on: ubuntu-latest
    needs: secret-scan
    timeout-minutes: 25
    env:
      FILVAULT_POSTGRES_PASSWORD: replace-with-local-postgres-password
      FILVAULT_S3_ACCESS_KEY: filvault
      FILVAULT_S3_SECRET_KEY: replace-with-local-s3-secret-key
      FILVAULT_INVITE_CODE: replace-with-local-invite-code
      FILVAULT_JWT_SECRET: replace-with-local-jwt-secret-min-32-chars
      FILVAULT_SEED_EMAIL: dev@filvault.com
      FILVAULT_SEED_PASSWORD: replace-with-local-seed-password
      FILVAULT_SEED_DISPLAY_NAME: Filvault Dev
      DSN: postgres://filvault:replace-with-local-postgres-password@127.0.0.1:5435/filvault?sslmode=disable
      E2E_EMAIL: dev@filvault.com
      E2E_PASSWORD: replace-with-local-seed-password
      E2E_BASE_URL: http://127.0.0.1:5173
      E2E_API_URL: http://127.0.0.1:8080
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Install web dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start Postgres and MinIO
        working-directory: .
        run: docker compose up -d postgres minio minio-init

      - name: Wait for Postgres
        working-directory: .
        run: |
          streak=0
          for i in $(seq 1 30); do
            if docker compose exec -T postgres psql -U filvault -d filvault -c 'SELECT 1' >/dev/null 2>&1; then
              streak=$((streak + 1))
              if [ "$streak" -ge 2 ]; then
                echo "postgres ready after ${i}s (2 consecutive SQL probes succeeded)"
                exit 0
              fi
            else
              streak=0
            fi
            sleep 1
          done
          echo "postgres did not become ready within 30s"
          docker compose ps -a
          docker compose logs --tail=80 postgres
          exit 1

      - name: Migrate and seed dev user
        working-directory: apps/api
        run: |
          go run ./cmd/migrate
          go run ./cmd/seed
        env:
          FILVAULT_DATABASE_URL: ${{ env.DSN }}
          FILVAULT_SEED_EMAIL: ${{ env.FILVAULT_SEED_EMAIL }}
          FILVAULT_SEED_PASSWORD: ${{ env.FILVAULT_SEED_PASSWORD }}
          FILVAULT_SEED_DISPLAY_NAME: ${{ env.FILVAULT_SEED_DISPLAY_NAME }}
          FILVAULT_INVITE_CODE: ${{ env.FILVAULT_INVITE_CODE }}

      - name: Start API
        working-directory: apps/api
        run: |
          go run ./cmd/api &
          echo $! > /tmp/filvault-api.pid
        env:
          FILVAULT_DATABASE_URL: ${{ env.DSN }}
          FILVAULT_METADATA_STORE: postgres
          FILVAULT_OBJECT_STORE: s3
          FILVAULT_S3_ENDPOINT: http://127.0.0.1:9002
          FILVAULT_S3_PUBLIC_ENDPOINT: http://127.0.0.1:9002
          FILVAULT_S3_BUCKET: filvault
          FILVAULT_S3_REGION: us-east-1
          FILVAULT_S3_ACCESS_KEY: ${{ env.FILVAULT_S3_ACCESS_KEY }}
          FILVAULT_S3_SECRET_KEY: ${{ env.FILVAULT_S3_SECRET_KEY }}
          FILVAULT_JWT_SECRET: ${{ env.FILVAULT_JWT_SECRET }}
          FILVAULT_INVITE_CODE: ${{ env.FILVAULT_INVITE_CODE }}
          FILVAULT_HTTP_ADDR: :8080
          FILVAULT_MAILER: console
          FILVAULT_CORS_ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173

      - name: Wait for API
        run: |
          for i in $(seq 1 60); do
            if curl -sf "${E2E_API_URL}/healthz" >/dev/null; then
              echo "API ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "API did not become ready"
          exit 1

      - name: Run Playwright E2E smoke
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  cli:
    name: CLI — lint, typecheck, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: apps/cli/go.sum

      - name: Lint
        run: go vet ./...

      - name: Typecheck
        run: go build -o /dev/null ./...

      - name: Test
        run: go test ./... -count=1
